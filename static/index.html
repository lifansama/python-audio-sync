<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>UniSound</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #eef2f5; margin-top: 30px; }
        .container { background: white; max-width: 520px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        #status { font-size: 14px; font-weight: bold; color: #007bff; background: #e9f3ff; padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        
        .upload-box { margin: 20px 0 5px 0; padding: 12px; background: #f8f9fa; border: 2px dashed #cbd3da; border-radius: 6px; text-align: left; font-size: 13px; }
        .upload-box input { width: 100%; margin-top: 5px; }

        .progress-container { margin: 20px 0; text-align: left; }
        .progress-bar-bg { background: #e9ecef; height: 8px; border-radius: 4px; overflow: hidden; position: relative; cursor: pointer; }
        .progress-bar-fill { background: #28a745; height: 100%; width: 0%; }
        .time-info { display: flex; justify-content: space-between; font-size: 12px; color: #6c757d; margin-top: 5px; }

        .file-list { text-align: left; margin: 15px 0; max-height: 180px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px; }
        .file-item { padding: 6px 10px; margin: 4px 0; cursor: pointer; border-radius: 4px; display: flex; align-items: center; }
        .file-item:hover { background-color: #f1f1f1; }
        .file-item input { margin-right: 10px; }
        
        .controls button { padding: 10px 16px; font-size: 14px; margin: 5px; border: none; border-radius: 6px; background: #28a745; color: white; cursor: pointer; transition: 0.2s; }
        .controls button:hover { opacity: 0.9; }
        .controls button.btn-secondary { background: #6c757d; }
        .controls button.btn-danger { background: #dc3545; }
        .controls button.btn-warning { background: #ffc107; color: #212529; }

        /* 底部监控面板样式 */
        .monitor-panel { margin-top: 20px; padding: 10px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; font-size: 12px; text-align: left; color: #495057; }
        .monitor-item { display: flex; justify-content: space-between; margin: 6px 0; align-items: center; }
        
        /* 动态连接与音频状态徽章 */
        .badge-online { color: #28a745; font-weight: bold; }
        .badge-offline { color: #dc3545; font-weight: bold; cursor: pointer; background: #f8d7da; padding: 2px 6px; border-radius: 4px; animation: pulse 1.5s infinite; }
        .audio-badge-active { color: #28a745; font-weight: bold; cursor: pointer; }
        .audio-badge-inactive { color: #856404; font-weight: bold; cursor: pointer; background: #fff3cd; padding: 2px 6px; border-radius: 4px; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h2>UniSound</h2>
    <div id="status" onclick="manualResumeAudio()">正在连接服务器与初始化音频引擎...（点击此处可手动激活声音）</div>

    <div class="progress-container">
        <div class="progress-bar-bg" id="progressBarBg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="time-info">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>
    </div>

    <div style="text-align: right; margin-top: 5px;">
        <button onclick="refreshFileList()" class="btn-secondary" style="font-size: 12px; padding: 4px 8px;">刷新播放列表</button>
    </div>

    <div class="file-list" id="playlist">
        <p style="color:#888; text-align:center;">正在加载播放列表...</p>
    </div>

    <div class="controls">
        <button id="playPauseBtn" onclick="togglePlayPause()" class="btn-warning">▶ 播放</button>
        <button onclick="actionWithSync(() => stop())" class="btn-danger">停止</button>
    </div>

    <!-- 监控面板 -->
    <div class="monitor-panel">
        <div class="monitor-item">
            <span>音频引擎状态：</span>
            <span id="audioStateVal" class="audio-badge-inactive" onclick="manualResumeAudio()">请点击这里激活音频状态</span>
        </div>
        <div class="monitor-item">
            <span>WebSocket 连接状态：</span>
            <span id="wsStatus" class="badge-offline" onclick="connectWs()">点击尝试重新连接</span>
        </div>
        <div class="monitor-item">
            <span>NTP 时钟偏移 (Time Offset)：</span>
            <span id="ntpOffsetVal">0 ms</span>
        </div>
        <div class="monitor-item">
            <span>网络往返延迟 (RTT)：</span>
            <span id="ntpRttVal">-- ms</span>
        </div>
        <div class="monitor-item">
            <span>在线连接设备数：</span>
            <span id="clientCountVal" style="font-weight: bold; color: #007bff;">1 台</span>
        </div>
    </div>

    <!-- 移至最底部的上传新 MP3 模块 -->
    <div class="upload-box">
        <label for="mp3File"><strong>上传新的 MP3 文件：</strong></label>
        <input type="file" id="mp3File" accept=".mp3" onchange="uploadAudioFile()">
    </div>
</div>

<script>
    let ws = null;
    const statusText = document.getElementById('status');
    const playlistContainer = document.getElementById('playlist');
    const progressBarFill = document.getElementById('progressBarFill');
    const currentTimeText = document.getElementById('currentTime');
    const totalTimeText = document.getElementById('totalTime');
    const playPauseBtn = document.getElementById('playPauseBtn');
    
    // 监控面板 DOM 元素
    const wsStatusElem = document.getElementById('wsStatus');
    const clientCountElem = document.getElementById('clientCountVal');
    const audioStateValElem = document.getElementById('audioStateVal');
    const ntpOffsetValElem = document.getElementById('ntpOffsetVal');
    const ntpRttValElem = document.getElementById('ntpRttVal');

    let audioCtx = null;
    let audioBuffers = {}; 
    let currentSource = null; 
    let pauseOffset = 0;     
    let playbackStartedAt = 0; 
    let startPositionOffset = 0; 
    let currentDuration = 0;   
    let progressAnimId = null; 
    let countdownTimer = null; 
    let isPlaying = false;    

    let timeOffset = 0; 
    let ntpSamples = [];
    let mp3Files = [];
    let currentIndex = 0;
    let ntpInterval = null;
    let pingInterval = null;

    function updateAudioStateUI() {
        if (!audioCtx) {
            audioStateValElem.className = "audio-badge-inactive";
            audioStateValElem.innerText = "请点击这里激活音频状态";
            return;
        }
        if (audioCtx.state === 'running') {
            audioStateValElem.className = "audio-badge-active";
            audioStateValElem.innerText = "音频已激活";
        } else {
            audioStateValElem.className = "audio-badge-inactive";
            audioStateValElem.innerText = "请点击这里激活音频状态";
        }
    }

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().then(() => {
                if (!isPlaying) {
                    statusText.innerText = "音频引擎已就绪，可正常同步播放";
                    statusText.style.color = "#007bff";
                    statusText.style.background = "#e9f3ff";
                }
                updateAudioStateUI();
            }).catch(err => {
                console.error("AudioContext 恢复受阻:", err);
                statusText.innerText = "⚠️ 浏览器拦截了声音，请点击页面任意处以解除静默";
                statusText.style.color = "#856404";
                statusText.style.background = "#fff3cd";
                updateAudioStateUI();
            });
        }
        updateAudioStateUI();
    }

    function manualResumeAudio() {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'running' && !isPlaying) {
            statusText.innerText = "✅ 音频上下文已激活";
            statusText.style.color = "#007bff";
            statusText.style.background = "#e9f3ff";
        }
        updateAudioStateUI();
    }

    setInterval(updateAudioStateUI, 1000);

    async function preloadAndDecode(filename) {
        initAudioContext();
        if (audioBuffers[filename]) return audioBuffers[filename];

        try {
            statusText.innerText = `正在后台预加载: ${filename}...`;
            statusText.style.color = "#007bff";
            statusText.style.background = "#e9f3ff";
            const response = await fetch(`/static/audio/${filename}`);
            const arrayBuffer = await response.arrayBuffer();
            const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            audioBuffers[filename] = decodedBuffer;
            statusText.innerText = `就绪: ${filename}`;
            return decodedBuffer;
        } catch (e) {
            statusText.innerText = `⚠️ 音频加载异常（可能网络波动）`;
            statusText.style.color = "#856404";
            statusText.style.background = "#fff3cd";
            console.error(e);
        }
    }

    // WebSocket 独立连接与重连管理
    function connectWs() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            return;
        }

        wsStatusElem.innerText = "正在连接服务器...";
        wsStatusElem.className = "badge-offline";

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            wsStatusElem.innerText = "已连接 (Online)";
            wsStatusElem.className = "badge-online";
            
            if (isPlaying) {
                statusText.innerText = "✅ 网络已恢复，正通过本地缓存安全播放中";
                statusText.style.color = "#28a745";
                statusText.style.background = "#e8f5e9";
            } else {
                statusText.innerText = "服务器已连接，随时准备接收考试指令";
                statusText.style.color = "#007bff";
                statusText.style.background = "#e9f3ff";
            }
            
            syncNtp();
            if (ntpInterval) clearInterval(ntpInterval);
            if (pingInterval) clearInterval(pingInterval);

            ntpInterval = setInterval(() => syncNtp(), 10000);
            pingInterval = setInterval(() => {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 20000);
        };

        ws.onclose = () => {
            wsStatusElem.innerText = "已断开连接 (点击重连)";
            wsStatusElem.className = "badge-offline";
            
            if (isPlaying) {
                statusText.innerText = "⚠️ 网络闪断，正依靠本地音频安全播放中（考试不受影响）";
                statusText.style.color = "#856404";
                statusText.style.background = "#fff3cd";
            } else {
                statusText.innerText = "⚠️ 与服务器断开连接，请点击下方状态栏重新连接";
                statusText.style.color = "#856404";
                statusText.style.background = "#fff3cd";
            }
        };

        ws.onerror = () => {
            wsStatusElem.innerText = "连接异常 (点击重试)";
            wsStatusElem.className = "badge-offline";
        };

        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === 'client_count') {
                clientCountElem.innerText = `${msg.count} 台`;
            }

            else if (msg.type === 'ntp:sync:reply') {
                const t3 = Date.now();
                const rtt = (t3 - msg.t0) - (msg.t2 - msg.t1);
                const serverTime = msg.t2 + (t3 - msg.t0) / 2;
                const currentOffset = serverTime - t3;

                if (rtt < 250) {
                    ntpSamples.push({ offset: currentOffset, rtt: rtt });
                    if (ntpSamples.length > 5) ntpSamples.shift();
                    ntpSamples.sort((a, b) => a.rtt - b.rtt);
                    timeOffset = ntpSamples[0].offset;

                    ntpOffsetValElem.innerText = `${Math.round(timeOffset)} ms`;
                    ntpRttValElem.innerText = `${rtt} ms`;
                }
            }

            else if (msg.type === 'pong') {}

            else if (msg.type === 'audio_list') {
                mp3Files = msg.files;
                renderPlaylist();
                if (mp3Files.length > 0 && !audioBuffers[mp3Files[currentIndex]]) {
                    await preloadAndDecode(mp3Files[currentIndex]);
                }
            }

            else if (msg.type === 'audio:select') {
                if (isPlaying) return;
                const filename = msg.filename;
                const index = mp3Files.indexOf(filename);
                if (index !== -1) {
                    currentIndex = index;
                    pauseOffset = 0;
                    updateRadioSelection();
                    await preloadAndDecode(filename);
                }
            }

            else if (msg.type === 'audio:schedule_play') {
                if (isPlaying && currentSource) {
                    console.log("当前正在本地离线安全播放，已忽略重连同步指令");
                    return;
                }

                const filename = msg.filename;
                const targetServerTime = msg.targetTime;
                let basePosition = msg.position || 0;

                const index = mp3Files.indexOf(filename);
                if (index !== -1) {
                    currentIndex = index;
                    updateRadioSelection();
                }

                statusText.innerText = `正在准备考场音频缓存...`;
                statusText.style.color = "#007bff";
                statusText.style.background = "#e9f3ff";
                
                let buffer = audioBuffers[filename];
                if (!buffer) {
                    buffer = await preloadAndDecode(filename);
                }

                if (!buffer || !buffer.duration) {
                    statusText.innerText = "音频解码未完成，请点击播放按钮";
                    return;
                }

                stopAudioNode();
                initAudioContext();
                
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                currentDuration = buffer.duration;
                totalTimeText.innerText = formatTime(currentDuration);

                const nowServer = Date.now() + timeOffset;
                let startPos = basePosition;
                
                if (nowServer >= targetServerTime) {
                    const elapsedServerSeconds = (nowServer - targetServerTime) / 1000;
                    startPos = basePosition + elapsedServerSeconds;
                }

                if (isNaN(startPos) || startPos < 0) startPos = 0;
                if (startPos >= currentDuration) {
                    statusText.innerText = `列表已播放完毕`;
                    return;
                }

                const currentSourceNode = audioCtx.createBufferSource();
                currentSourceNode.buffer = buffer;
                currentSourceNode.connect(audioCtx.destination);
                
                currentSourceNode.onended = () => {
                    if (currentSource === currentSourceNode) {
                        currentSource = null;
                        stopProgressLoop();
                        isPlaying = false;
                        playPauseBtn.innerText = "▶ 播放";
                        statusText.innerText = "播放完毕";
                        statusText.style.color = "#007bff";
                        statusText.style.background = "#e9f3ff";
                    }
                };

                currentSource = currentSourceNode;
                startPositionOffset = startPos;

                let targetAudioTime;
                const timeLeft = targetServerTime - nowServer;

                if (timeLeft > 200) {
                    const targetLocalTime = targetServerTime - timeOffset;
                    targetAudioTime = audioCtx.currentTime + (targetLocalTime - Date.now()) / 1000;
                } else {
                    targetAudioTime = audioCtx.currentTime + 0.05;
                }
                
                try {
                    currentSourceNode.start(targetAudioTime, startPos);
                } catch (e) {
                    console.error("Audio start 错误被拦截:", e);
                    currentSourceNode.start(audioCtx.currentTime + 0.05, 0);
                }

                playbackStartedAt = targetAudioTime;
                startProgressLoop();
                
                isPlaying = true;
                playPauseBtn.innerText = "⏸ 暂停";

                if (countdownTimer) clearInterval(countdownTimer);

                if (timeLeft > 200) {
                    countdownTimer = setInterval(() => {
                        const currentNowServer = Date.now() + timeOffset;
                        const remaining = targetServerTime - currentNowServer;

                        if (remaining <= 0) {
                            clearInterval(countdownTimer);
                            countdownTimer = null;
                            statusText.innerText = `正在播放: ${filename}`;
                        } else {
                            statusText.innerText = `考场同步倒计时... ${(remaining / 1000).toFixed(2)} 秒`;
                        }
                    }, 50);
                } else {
                    statusText.innerText = `正在播放: ${filename} (已多设备实时同步)`;
                }
            }

            else if (msg.type === 'audio:pause') {
                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                if (currentSource) {
                    pauseOffset = startPositionOffset + (audioCtx.currentTime - playbackStartedAt);
                }
                stopAudioNode();
                stopProgressLoop();
                
                isPlaying = false;
                playPauseBtn.innerText = "▶ 播放";
                statusText.innerText = `已暂停 (进度: ${formatTime(pauseOffset)})`;
                statusText.style.color = "#007bff";
                statusText.style.background = "#e9f3ff";
            }

            else if (msg.type === 'audio:stop') {
                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                stopAudioNode();
                stopProgressLoop();
                pauseOffset = 0;
                updateProgressUI(0, 0);
                
                isPlaying = false;
                playPauseBtn.innerText = "▶ 播放";
                statusText.innerText = '已停止';
                statusText.style.color = "#007bff";
                statusText.style.background = "#e9f3ff";
            }
        };
    }

    connectWs();

    function stopAudioNode() {
        if (currentSource) {
            try { currentSource.stop(); } catch(e) {}
            currentSource.disconnect();
            currentSource = null;
        }
    }

    function startProgressLoop() {
        stopProgressLoop();
        function update() {
            if (!currentSource) return;
            
            let currentPos = startPositionOffset + (audioCtx.currentTime - playbackStartedAt);
            
            if (currentPos >= 0) {
                if (currentPos > currentDuration) currentPos = currentDuration;
                updateProgressUI(currentPos, currentDuration);
            }

            if (currentPos < currentDuration) {
                progressAnimId = requestAnimationFrame(update);
            }
        }
        progressAnimId = requestAnimationFrame(update);
    }

    function stopProgressLoop() {
        if (progressAnimId) {
            cancelAnimationFrame(progressAnimId);
            progressAnimId = null;
        }
    }

    function updateProgressUI(current, total) {
        currentTimeText.innerText = formatTime(current);
        totalTimeText.innerText = formatTime(total);
        const percent = total > 0 ? (current / total) * 100 : 0;
        progressBarFill.style.width = `${Math.min(100, Math.max(0, percent))}%`;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function syncNtp(callback) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const t0 = Date.now();
        ws.send(JSON.stringify({ type: 'ntp:sync', t0: t0 }));
        if (callback) setTimeout(callback, 100);
    }

    function actionWithSync(actionCallback) {
        initAudioContext();
        syncNtp(actionCallback);
    }

    async function uploadAudioFile() {
        const fileInput = document.getElementById('mp3File');
        if (fileInput.files.length === 0) return;

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", file);

        statusText.innerText = `正在上传 ${file.name}...`;
        try {
            const response = await fetch('/upload', { method: 'POST', body: formData });
            const result = await response.json();
            if (result.success) {
                statusText.innerText = `上传成功: ${result.filename}`;
                fileInput.value = '';
            } else {
                statusText.innerText = `上传失败: ${result.message}`;
            }
        } catch (e) {
            statusText.innerText = `上传出错`;
            console.error(e);
        }
    }

    function togglePlayPause() {
        actionWithSync(() => {
            if (isPlaying) {
                pause();
            } else {
                playSelected();
            }
        });
    }

    function playSelected() {
        if (mp3Files.length === 0) return alert("audio 文件夹下没有 mp3 文件！");
        const selectedRadio = document.querySelector('input[name="audioFile"]:checked');
        if (!selectedRadio) return alert("请先选择要播放的文件！");

        const filename = selectedRadio.value;
        ws.send(JSON.stringify({
            type: 'cmd:play',
            filename: filename,
            position: pauseOffset
        }));
    }

    function pause() { 
        ws.send(JSON.stringify({ type: 'cmd:pause' })); 
    }

    function stop() { 
        pauseOffset = 0;
        ws.send(JSON.stringify({ type: 'cmd:stop' })); 
    }

    function refreshFileList() { ws.send(JSON.stringify({ type: 'refresh_files' })); }

    function renderPlaylist() {
        if (mp3Files.length === 0) {
            playlistContainer.innerHTML = '<p style="color:#888; text-align:center;">static/audio/ 目录下未发现 .mp3 文件</p>';
            return;
        }
        playlistContainer.innerHTML = '';
        mp3Files.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            const checkedAttr = index === currentIndex ? 'checked' : '';
            item.innerHTML = `
                <input type="radio" id="file_${index}" name="audioFile" value="${file}" ${checkedAttr} onchange="onRadioChange(${index})">
                <label for="file_${index}" style="cursor:pointer; width:100%;">${file}</label>
            `;
            playlistContainer.appendChild(item);
        });
    }

    function onRadioChange(index) {
        currentIndex = index;
        pauseOffset = 0;
        const filename = mp3Files[currentIndex];
        broadcastSelection(filename);
    }

    function broadcastSelection(filename) {
        ws.send(JSON.stringify({
            type: 'cmd:select',
            filename: filename
        }));
    }

    function updateRadioSelection() {
        const radios = document.getElementsByName('audioFile');
        if (radios[currentIndex]) radios[currentIndex].checked = true;
    }

    document.body.addEventListener('click', () => {
        initAudioContext();
    }, { once: false });
</script>

</body>
</html>
